<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>

  <link rel="stylesheet" href="/css/dashboard.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >
</head>
<body>

  <main class="dashboard">

  
   
         <section class="menu">

      <h1 class="logo">SHOP.CO</h1>

      <nav class="menu-nav">

    <button class="menu-btn">
          <p>Dashboard</p>
        </button>

        <button class="menu-btn">
          <p>Products</p>
        </button>

        <button class="menu-btn"><p>Types</p></button>

      </nav>

      <input class="range" type="range">

    </section>

    <section class="content">

      <div class="top">

        <button popovertarget="modal" class="add-btn">
         + Add product
        </button>

      </div>
      <div popover="" id="modal" class="add-product__modal">
        <h3 class="modal-title">Add new product</h3>

        <form class="form">
          <div class="inputs">
            <input class="title input " type="text" placeholder="title" />
          <br>
<input class="price input" type="text" placeholder="price" />
<br>
<input class="size input" type="text" placeholder="size" />
<br>
<input class="colors input" type="text" placeholder="colors" />
<br>
<input class="type input" type="text" placeholder="type" />

<br>
<input class="category input" type="text" placeholder="category" />
<br>
<input class="description input" type="text" placeholder="description" />
<br>
<input class="file input" type="file" />
          </div>
<br>
<button class="submit" type="submit">Submit</button>
        </form>
      </div>

      <div class="table">

        <div class="table-head">

          <p class="head-item">TR</p>
          <p class="head-item">Image</p>
          <p class="head-item">Name</p>
          <p class="head-item">Price</p>
          <p class="head-item">Discount</p>
          <p class="head-item">Rate</p>
         

        </div>

        <div class="table-row">

        </div>
 

        <div class="edit-modal">
          <form class="edit-form">
            <h3 class="edit-txt">Edit product</h3>
            <input type="text" class="edit-title">
            <input type="text" class="edit-price">
            <input type="text" class="edit-colors">
            <button class="edit__btn-modal" type="submit">submit</button>
          </form>

        </div>
    </section>
   

  </main>


  <script src="/js/dashboard.js"></script>
</body>
</html>
