<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop co</title>
    <link rel="stylesheet" href="/css/register.css">
   <link href="
https://cdn.jsdelivr.net/npm/izitoast@1.4.0/dist/css/iziToast.min.css
" rel="stylesheet">

</head>
<body>
    <main>
         <section class="register-section">

   <div class="container">
    <div class="register-wrapper">
         <div class="shape-left"></div>
    <div class="shape-right"></div>

    <div class="register-box">

      <h1 class="register-title">Register</h1>

      <form class="register-form">
         <label class="register-label">First name</label>
        <input id="firstname" class="register-input firstname" type="text" placeholder="Enter your firstname">

         <label class="register-label">Last name</label>
        <input id="lastname" class="register-input lastname" type="text" placeholder="Enter your lastname">


        <label class="register-label">Email</label>
        <input id="email" class="register-input email" type="email" placeholder="Enter your email">

        <label class="register-label">Password</label>
        <input id="password" class="register-input password" type="password" placeholder="********">

        <label class="register-label">Confirm Password</label>
        <input id="checkpassword" class="register-input checkpassword" type="password" placeholder="********">

        <label class="register-label">Confirm Password</label>
        <input id="role" class="register-input role" type="text" placeholder="your role">

        <button id="submit" type="submit" class="register-btn">Sign In</button>

      </form>

      <p class="register-text">
        Don't have an account?
        <a class="register-link" href="#">Sign up for free!</a>
      </p>

    </div>
    </div>
   </div>

  </section>
    </main>
  <script src="https://cdn.jsdelivr.net/npm/izitoast@1.4.0/dist/js/iziToast.min.js"></script>
    <script defer src="/js/register.js"></script>
</body>
</html>
